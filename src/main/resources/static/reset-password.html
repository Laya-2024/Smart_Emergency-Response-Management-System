<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset password — SafeLink</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="split-page">
  <div class="split-left">
    <a class="brand" href="/">SafeLink</a>
    <h2>Set a new password.</h2>
    <p>Choose a strong password with at least 12 characters including uppercase, lowercase, number and symbol.</p>
  </div>
  <div class="split-right">
    <div class="auth-card">
      <h1>New password</h1>
      <p class="sub">Your reset link is valid for 20 minutes.</p>
      <form id="reset">
        <label>New password
          <input name="newPassword" type="password" minlength="12" required placeholder="Min 12 characters">
        </label>
        <button class="btn-primary" type="submit">Update password</button>
      </form>
      <div class="msg" id="rp-msg"></div>
      <div class="auth-links"><span><a href="/login.html">Back to sign in</a></span></div>
    </div>
  </div>
  <script>
    function setMsg(t,e){const el=document.querySelector('#rp-msg');el.className='msg '+(e?'err':'ok');el.innerHTML=t;}
    document.querySelector('#reset').addEventListener('submit', async e => {
      e.preventDefault();
      const token=new URLSearchParams(location.search).get('token');
      if(!token){setMsg('Reset link is missing or invalid.',true);return;}
      const btn=e.target.querySelector('.btn-primary'); btn.disabled=true; btn.textContent='Updating…';
      try {
        const r=await fetch('/api/v1/auth/password-reset/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,newPassword:new FormData(e.target).get('newPassword')})});
        if(!r.ok){const e2=await r.json().catch(()=>({}));throw new Error(e2.detail||'Reset failed.');}
        setMsg('✅ Password updated! <a href="/login.html">Sign in now →</a>');
      } catch(err){setMsg(err.message,true);}
      finally{btn.disabled=false;btn.textContent='Update password';}
    });
  </script>
</body>
</html>

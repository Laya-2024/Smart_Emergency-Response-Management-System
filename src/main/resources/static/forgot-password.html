<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Forgot password — SafeLink</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="split-page">
  <div class="split-left">
    <a class="brand" href="/">SafeLink</a>
    <h2>Forgot your password?</h2>
    <p>Enter your registered email and we'll send a secure reset link valid for 20 minutes.</p>
  </div>
  <div class="split-right">
    <div class="auth-card">
      <h1>Reset password</h1>
      <p class="sub">Enter your registered email to receive a reset link.</p>
      <form id="forgot">
        <label>Email address
          <input name="email" type="email" required placeholder="you@example.com">
        </label>
        <button class="btn-primary" type="submit">Send reset link</button>
      </form>
      <div class="msg" id="fp-msg"></div>
      <div class="auth-links">
        <span>Remembered it? <a href="/login.html">Sign in</a></span>
        <span>New here? <a href="/register.html">Create an account</a></span>
      </div>
    </div>
  </div>
  <script>
    function setMsg(t,e){const el=document.querySelector('#fp-msg');el.className='msg '+(e?'err':'ok');el.innerHTML=t;}
    document.querySelector('#forgot').addEventListener('submit', async e => {
      e.preventDefault();
      const btn=e.target.querySelector('.btn-primary'); btn.disabled=true; btn.textContent='Sending…';
      try {
        await fetch('/api/v1/auth/password-reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:new FormData(e.target).get('email')})});
        setMsg('If an account exists for that email, a reset link has been sent. Check your inbox.');
      } catch { setMsg('Could not process that request. Please try again.',true); }
      finally { btn.disabled=false; btn.textContent='Send reset link'; }
    });
  </script>
</body>
</html>

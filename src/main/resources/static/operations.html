<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relief operations — SafeLink</title><link rel="stylesheet" href="/css/app.css"></head><body><header><a class="brand" href="/">SafeLink</a><span>Disaster and relief operations</span></header><main><h1>Community relief</h1><section class="modules"><article><h3>Open shelters</h3><div id="shelters">Loading…</div></article><article><h3>Request help</h3><form id="relief"><input name="requestType" placeholder="Food, water, shelter, rescue" required><input name="peopleCount" type="number" min="1" value="1"><textarea name="description" placeholder="Describe what is needed"></textarea><button class="sos">Submit request</button></form></article><article><h3>Donate</h3><form id="donation"><input name="donationType" placeholder="MONEY or ITEMS" required><input name="amount" type="number" step="0.01" placeholder="Amount"><input name="currency" value="INR" maxlength="3"><textarea name="itemDescription" placeholder="Items, if any"></textarea><button class="sos">Pledge donation</button></form></article></section></main><script src="/js/operations.js"></script></body></html>

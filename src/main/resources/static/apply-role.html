<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verification documents - SafeLink</title><link rel="stylesheet" href="/css/app.css"></head><body class="account"><main class="card"><a class="brand" href="/">SafeLink</a><h1 id="page-title">Verification documents</h1><p id="page-help">Upload documents for administrator review. Aadhaar must be masked; never enter the complete number.</p><form id="role-application"><div id="professional-fields"><label>Role<select name="requestedRole"><option>VOLUNTEER</option><option>DOCTOR</option><option>POLICE</option><option>FIRE</option><option>PARAMEDIC</option><option>DISPATCHER</option><option>SHELTER_MANAGER</option><option>NGO</option></select></label><label>Organisation / hospital / station<input name="organisationName" required></label><label>Masked professional ID<input name="professionalIdMasked" placeholder="XXXX-XXXX-1234" required></label><label>Skills / licence / service details<textarea name="detailsJson" required></textarea></label><label>Profile photo (image, max 5 MB)<input name="photo" type="file" accept="image/*" required></label><label>ID / licence (image or PDF, max 5 MB)<input name="identity" type="file" accept="image/*,application/pdf" required></label></div><div id="public-fields" hidden><label>Verification document<select name="documentType"><option value="PHOTO">Profile photo</option><option value="IDENTITY">Masked Aadhaar / identity document</option></select></label><label>Upload one document (image or PDF, max 5 MB)<input name="publicDocument" type="file" accept="image/*,application/pdf"></label></div><button class="sos" id="submit-button">Submit for review</button></form><p id="message"></p></main><script src="/js/apply-role.js"></script></body></html>
